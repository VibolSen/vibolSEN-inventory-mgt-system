spring.application.name=inventory_mgt_db

# Server Configuration (Render automatically sets $PORT, defaults to 8080 locally)
server.port=${PORT:8080}

# MySQL / TiDB Database Configuration (Environment variables override for cloud, defaults to local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory_mgt_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Vibol@2020}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Jackson JSON Settings (REST API serialization)
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
